[package]
name = "pm"
version = "0.1.0"
edition = "2021"
description = "Prompt Maker (pm) — build disciplined prompts for coding agents"
license = "MIT"
keywords = ["tui", "cli", "prompt", "ratatui", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "pm"
path = "src/lib.rs"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
strip = true
lto = true
